<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0f172a"/>
  <!-- Scales of justice icon -->
  <g transform="translate(50,50)" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center pole -->
    <line x1="0" y1="-28" x2="0" y2="22"/>
    <!-- Base -->
    <line x1="-18" y1="22" x2="18" y2="22"/>
    <!-- Balance beam -->
    <line x1="-22" y1="-8" x2="22" y2="-8"/>
    <!-- Left pan strings -->
    <line x1="-22" y1="-8" x2="-28" y2="8"/>
    <line x1="-22" y1="-8" x2="-16" y2="8"/>
    <!-- Left pan -->
    <path d="M -30 8 Q -22 14 -14 8"/>
    <!-- Right pan strings -->
    <line x1="22" y1="-8" x2="28" y2="8"/>
    <line x1="22" y1="-8" x2="16" y2="8"/>
    <!-- Right pan -->
    <path d="M 14 8 Q 22 14 30 8"/>
    <!-- Top -->
    <circle cx="0" cy="-28" r="3" fill="#818cf8" stroke="none"/>
  </g>
</svg>